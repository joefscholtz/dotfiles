# Please note not all available settings / options are set here.
# For a full list, see the wiki
#
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hyprpm reload -n

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=HDMI-A-1,1600x900@60,auto-right,auto
$monitor_name = HDMI-A-2
monitor=$monitor_name,1600x900@60,auto-right,auto
monitor=HEADLESS-2,1600x900@60,0x0,1
monitor=,preferred,auto,auto

workspace = 1, monitor:$monitor_name, default:true
workspace = 2, monitor:$monitor_name
workspace = 3, monitor:$monitor_name
workspace = 4, monitor:$monitor_name
workspace = 5, monitor:$monitor_name
workspace = 6, HEADLESS-2
workspace = 7, HEADLESS-2
workspace = 8, HEADLESS-2
workspace = 9, HEADLESS-2
workspace = 0, HEADLESS-2

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch

# Launch topbar and set wallpaper
exec-once = hyprland-autoname-workspaces -c $HOME/.config/hypr/hyprland-autoname-workspaces-config.toml & waybar &
exec-once = mpvpaper -vs -f -o "no-audio loop --panscan=1" ALL ~/.config/assets/wallpapers/solar_system_01.gif &
# exec-once = mpvpaper -vs -f $monitor_name ~/.config/assets/wallpapers/void.jpg &
exec-once = hyprctl setcursor Bibata-Modern-Classic 24 &
# exec-once = quickshell

# exec-once = clipse -listen
#
# windowrule = float, class:(clipse)
# windowrule = size 622 652, class:(clipse)
# windowrule = stayfocused, class:(clipse)
#
# bind = SUPER, V, exec, kitty --class clipse -e clipse

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = rofi -modes "drun,calc,window" -show "drun" -config $HOME/.config/rofi/config.rasi
$calc = rofi -modes "calc" -show "calc" -config $HOME/.config/rofi/config.rasi
#
# Some default env vars.
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that
#env = GTK_THEME, Papirus-Dark
env = ICON_THEME, Bibata-Modern-Classic

input {
    kb_layout = br
    kb_variant =
    kb_model =
    kb_options = caps:none
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.
}

general {
    gaps_in = 4
    gaps_out = 5
    border_size = 3

    # dracula
    col.active_border = rgb(bd93f9)
    col.inactive_border = rgba(44475aaa)

    layout = scrolling

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

}

cursor{
  inactive_timeout = 0
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 15
    
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow{
      enabled = true
      range = 4
      render_power = 3
      color = rgba(1a1a1aee)
    }
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
}

windowrulev2 = suppressevent maximize, class:.* 
windowrule = match:class ^(kitty)$, tile on
# windowrule = plugin:hyprbars:no_bar,class:^(kitty)
# windowrule = plugin:hyprbars:no_bar,class:^(google-chrome)$
# windowrule = plugin:hyprbars:no_bar,class:^(firefox)$
windowrule = workspace special:kittybtop,match:class ^(kitty)$,match:title btop

$mainMod = SUPER

# bind = $mainMod, B, exec, hyprctl dispatch togglespecialworkspace special:kittybtop || kitty &
# bind = $mainMod, B, exec, float, kitty && hyprctl dispatch movetoworkspace special:kittybtop 
bind = $mainMod, B, exec, [workspace special:kittybtop, title:btop] $terminal "btop"


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod, A, exec, quickshell-client toggle my-calendar
bind = $mainMod, Q, killactive,
bind = $mainMod, X, killactive,
bind = $mainMod, T, exec, $terminal --class "kitty"
bind = $mainMod, Y, exec, restart_waybar.sh
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, togglefloating, 
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, exec, $calc
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, S, togglesplit, # dwindle
bind = $mainMod, S, movetoworkspace, special

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows
# bind = $mainMod SHIFT, H, movewindow, l
# bind = $mainMod SHIFT, L, movewindow, r
# bind = $mainMod SHIFT, K, movewindow, u
# bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, H, layoutmsg, movewindowto l
bind = $mainMod SHIFT, L, layoutmsg, movewindowto r
bind = $mainMod SHIFT, K, layoutmsg, movewindowto u
bind = $mainMod SHIFT, J, layoutmsg, movewindowto d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
#bind = $mainMod, S, togglespecialworkspace, magic
#bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#Screenshot
# Screenshot a window
bind = $mainMod, PRINT, exec, hyprshot -m window
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $shiftMod, PRINT, exec, hyprshot -m region


plugin {
  hyprbars {
      bar_height = 15
      bar_padding = 20
      bar_title_enabled = false

      bar_color = rgb(11111B)
      hyprbars-button = rgb(FF5555), 12, , hyprctl dispatch killactive
      hyprbars-button = rgb(50FA7B), 12, , hyprctl dispatch fullscreen 1
      hyprbars-button = rgb(F1FA8C), 12, , hyprctl dispatch togglefloating

      on_double_click = hyprctl dispatch fullscreen 1
  }
  hyprscrolling {
    column_width = 0.485
    focus_fit_method = 1
    fullscreen_on_one_column = true
  }
  hyprwinwrap {
      class = hyprwinwrap-wallpaper
  }

  dynamic-cursors {

    # enables the plugin
    enabled = true

    # sets the cursor behaviour, supports these values:
    # tilt    - tilt the cursor based on x-velocity
    # rotate  - rotate the cursor based on movement direction
    # stretch - stretch the cursor shape based on direction and velocity
    # none    - do not change the cursors behaviour
    mode = stretch

    # minimum angle difference in degrees after which the shape is changed
    # smaller values are smoother, but more expensive for hw cursors
    threshold = 2

    # for mode = stretch
    stretch {

        # controls how much the cursor is stretched
        # this value controls at which speed (px/s) the full stretch is reached
        # the full stretch being twice the original length
        limit = 3000

        # relationship between speed and stretch amount, supports these values:
        # linear             - a linear function is used
        # quadratic          - a quadratic function is used
        # negative_quadratic - negative version of the quadratic one, feels more aggressive
        # see `activation` in `src/mode/utils.cpp` for how exactly the calculation is done
        function = quadratic

        # time window (ms) over which the speed is calculated
        # higher values will make slow motions smoother but more delayed
        window = 100
    }

    # configure shake to find
    # magnifies the cursor if its is being shaken
    shake {

        # enables shake to find
        enabled = false

        # use nearest-neighbour (pixelated) scaling when shaking
        # may look weird when effects are enabled
        nearest = true

        # controls how soon a shake is detected
        # lower values mean sooner
        threshold = 4.0

        # magnification level immediately after shake start
        base = 5.0
        # magnification increase per second when continuing to shake
        speed = 50.0
        # how much the speed is influenced by the current shake intensitiy
        influence = 2.0

        # maximal magnification the cursor can reach
        # values below 1 disable the limit (e.g. 0)
        limit = 2.0

        # time in millseconds the cursor will stay magnified after a shake has ended
        timeout = 50

        # show cursor behaviour `tilt`, `rotate`, etc. while shaking
        effects = true

        # enable ipc events for shake
        # see the `ipc` section below
        ipc = false
    }

    # use hyprcursor to get a higher resolution texture when the cursor is magnified
    # see the `hyprcursor` section below
    hyprcursor {

        # use nearest-neighbour (pixelated) scaling when magnifing beyond texture size
        # this will also have effect without hyprcursor support being enabled
        # 0 / false - never use pixelated scaling
        # 1 / true  - use pixelated when no highres image
        # 2         - always use pixleated scaling
        nearest = true

        # enable dedicated hyprcursor support
        enabled = true

        # resolution in pixels to load the magnified shapes at
        # be warned that loading a very high-resolution image will take a long time and might impact memory consumption
        # -1 means we use [normal cursor size] * [shake:base option]
        resolution = -1

        # shape to use when clientside cursors are being magnified
        # see the shape-name property of shape rules for possible names
        # specifying clientside will use the actual shape, but will be pixelated
        fallback = clientside
    }
  }
}
