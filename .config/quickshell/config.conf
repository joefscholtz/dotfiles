# Import the CSS file for styling.
style = "style.css"

# Define the calendar widget.
# We give it a unique name "my-calendar" to be able to toggle it.
[my-calendar]
# The type of widget this is.
type = "calendar"

# The name of the monitor to display on. Use `hyprctl monitors` to find yours.
# "focused" will show it on the currently active monitor.
monitor = "focused"

# The layer to render on. "overlay" is usually what you want for a popup widget.
# Other options: "background", "bottom", "top".
layer = "overlay"

# Set the position of the widget on the screen.
# Format is: "horizontal vertical"
# Horizontal options: "left", "center", "right"
# Vertical options: "top", "center", "bottom"
position = "top center"

# Add margins to push the widget away from the edges.
# Format is: "top right bottom left"
margins = "45 0 0 0"

# --- Calendar-Specific Options ---

# Define the font for the calendar.
font = "JetBrainsMono Nerd Font"

# Font size for the days.
font-size = 14

# Format for the day numbers. "%d" is standard. Use "%e" for no leading zero.
day-format = "%d"

# Format for the header showing the current month and year.
# %B = Full month name, %Y = Full year.
date-format = "%B %Y"

# Optional: Set the first day of the week.
# 0=Sunday, 1=Monday, etc. Defaults to your locale's setting.
# first-day-of-week = 1

# Optional: Number of months to show before and after the current month.
# This would show a 3-month view (last month, this month, next month).
# months-before = 1
# months-after = 1
